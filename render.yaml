# Optional Render Blueprint. You can also create the service by hand (see README).
services:
  - type: web
    name: phz-portfolio-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: IMAGE_PROVIDER
        value: none
      - key: EMAIL_PROVIDER
        value: resend
      - key: CONTACT_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false
